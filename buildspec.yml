version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - cd src && npm install
  
  pre_build:
    commands:
      - echo "Running tests..."
      - cd src && npm test
  
  build:
    commands:
      - echo "Build phase - no compilation needed for Node.js"
  
  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - '**/*'